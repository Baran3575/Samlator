name: keystore

# One-shot: creates the release signing key so every CI build shares a
# signature and updates install over the previous APK instead of demanding an
# uninstall. Run once, download `samlator.jks` from the `build-key` release and
# commit it to android/keystore/.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  key:
    runs-on: ubuntu-24.04
    steps:
      - name: Generate
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore samlator.jks \
            -alias samlator \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass samlator -keypass samlator \
            -dname "CN=Samlator, OU=dev, O=Samlator, L=, S=, C=TR"
          keytool -list -keystore samlator.jks -storepass samlator
          sha256sum samlator.jks

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view build-key >/dev/null 2>&1 || \
            gh release create build-key --title "Release signing key" \
              --notes "Stable key so APK updates install over the old build. Passwords: samlator"
          gh release upload build-key samlator.jks --clobber
