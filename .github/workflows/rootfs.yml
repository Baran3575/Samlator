name: rootfs

# Builds the payload the app downloads on first setup: an Ubuntu arm64 base
# root filesystem, the proot-rs helper, and a manifest with their checksums.
# Published to the rolling release `rootfs-latest`, which is the URL baked into
# samlator-core (RELEASE_MANIFEST).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rootfs.yml"

permissions:
  contents: write

jobs:
  payload:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd

      - name: Root filesystem
        run: |
          set -euo pipefail
          URL="https://cdimage.ubuntu.com/ubuntu-base/releases/24.04/release/ubuntu-base-24.04.5-base-arm64.tar.gz"
          curl -fL --retry 3 --retry-delay 5 -o rootfs.tar.gz "$URL"
          mkdir -p out
          gzip -dc rootfs.tar.gz | zstd -q -19 -T0 -o out/rootfs.tar.zst
          ls -lh out/rootfs.tar.zst

      - name: proot-rs helper
        run: |
          set -euo pipefail
          URL="https://github.com/proot-me/proot-rs/releases/download/v0.1.0/proot-rs-v0.1.0-aarch64-linux-android.tar.gz"
          curl -fL --retry 3 --retry-delay 5 -o proot.tar.gz "$URL"
          tar -xzf proot.tar.gz -C out proot-rs
          chmod +x out/proot-rs
          file out/proot-rs

      # proot-rs 0.1.0 cannot exec a glibc binary on Android 15: it stages a
      # loader in a temp dir, which Android has no /tmp for, and its ptrace
      # model trips the seccomp filter. Classic PRoot (Termux lineage) does the
      # job with its own loader, so ship that tree as a payload as well.
      - name: Classic PRoot
        run: |
          set -euo pipefail
          mkdir -p debs stage out/proot
          fetch() {
            for base in \
              https://packages-cf.termux.dev/apt/termux-main \
              https://packages.termux.dev/apt/termux-main
            do
              for try in 1 2 3; do
                case "$1" in
                  proot) name="proot_5.1.107.102_aarch64.deb"; dir="p/proot" ;;
                  talloc) name="libtalloc_2.5.0_aarch64.deb"; dir="libt/libtalloc" ;;
                  shmem) name="libandroid-shmem_0.7_aarch64.deb"; dir="liba/libandroid-shmem" ;;
                esac
                if curl -fsSL --retry 2 -o "debs/$name" "$base/pool/main/$dir/$name"; then
                  echo "ok $name from $base"
                  return 0
                fi
                sleep 3
              done
            done
            echo "could not fetch $1" >&2
            return 1
          }
          fetch proot
          fetch talloc
          fetch shmem
          ls -l debs
          for d in debs/*.deb; do
            ( cd debs && ar x "$(basename "$d")" )
            # Termux debs use ./data/data/com.termux/files/usr, so locate files
            # instead of guessing how many components to strip.
            tar -xf debs/data.tar.* -C stage
            rm -f debs/data.tar.*
          done
          find stage -maxdepth 8 -name proot -type f | head -3
          mkdir -p out/proot/bin out/proot/lib out/proot/libexec/proot out/proot/tmp
          cp "$(find stage -type f -path '*/usr/bin/proot' | head -1)" out/proot/bin/proot
          cp "$(find stage -type f -path '*/usr/libexec/proot/loader' | head -1)" out/proot/libexec/proot/loader
          cp "$(find stage -type f -path '*/usr/libexec/proot/loader32' | head -1)" out/proot/libexec/proot/loader32
          cp -a "$(find stage -type f -name 'libtalloc.so.2' | head -1)" out/proot/lib/libtalloc.so.2
          cp -a "$(find stage -type f -name 'libandroid-shmem.so' | head -1)" out/proot/lib/libandroid-shmem.so
          chmod +x out/proot/bin/proot out/proot/libexec/proot/loader*
          ls -lR out/proot
          tar -C out/proot -cf - bin lib libexec | zstd -q -19 -T0 -o out/proot.tar.zst
          ls -lh out/proot.tar.zst

      - name: Manifest
        run: |
          set -euo pipefail
          ROOTFS_SHA=$(sha256sum out/rootfs.tar.zst | cut -d' ' -f1)
          PROOT_SHA=$(sha256sum out/proot-rs | cut -d' ' -f1)
          CLASSIC_SHA=$(sha256sum out/proot.tar.zst | cut -d' ' -f1)
          BASE="https://github.com/Baran3575/Samlator/releases/download/rootfs-latest"
          cat > out/manifest.json <<EOF
          {
            "rootfs": {
              "id": "rootfs",
              "url": "${BASE}/rootfs.tar.zst",
              "sha256": "${ROOTFS_SHA}",
              "kind": "rootfs",
              "strip": 0,
              "target": "rootfs"
            },
            "payloads": [
              {
                "id": "proot",
                "url": "${BASE}/proot-rs",
                "sha256": "${PROOT_SHA}",
                "kind": "helper",
                "strip": 0,
                "target": "bin"
              },
              {
                "id": "proot-classic",
                "url": "${BASE}/proot.tar.zst",
                "sha256": "${CLASSIC_SHA}",
                "kind": "helper-tree",
                "strip": 0,
                "target": "proot"
              }
            ]
          }
          EOF
          python3 -m json.tool out/manifest.json
          cat out/manifest.json >> "$GITHUB_STEP_SUMMARY"

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view rootfs-latest >/dev/null 2>&1 || \
            gh release create rootfs-latest \
              --title "Root filesystem payload" \
              --notes "Ubuntu 24.04 arm64 base + proot-rs. Generated by the rootfs workflow."
          gh release upload rootfs-latest \
            out/rootfs.tar.zst out/proot-rs out/proot.tar.zst out/manifest.json --clobber
          gh release view rootfs-latest --json assets \
            -q '.assets[] | "\(.name) \(.size)"'
