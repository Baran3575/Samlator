plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.samlator'
    compileSdk 35
    ndkVersion '27.0.12077973'

    defaultConfig {
        applicationId 'dev.samlator'
        // Android 10+ refuses execve() on files inside the app's own data dir
        // for anything targeting API 29 or newer (W^X). proot-rs and every
        // guest binary live there, so we stay at 28 like Termux does; the app
        // is sideloaded, never distributed through Play.
        minSdk 28
        targetSdk 28
        versionCode 1
        versionName '0.1.0'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    sourceSets {
        main {
            // `scripts/build-apk.sh` drops the cargo-built cdylib here.
            jniLibs.srcDirs = ['src/main/jniLibs']
            assets.srcDirs = ['src/main/assets']
        }
    }

    // A stable key checked into the repo: sideloaded APKs must keep the same
    // signature or Android refuses to install over the previous build and the
    // user has to uninstall every update. It is not a secret worth keeping,
    // the app is never published to Play.
    signingConfigs {
        stable {
            storeFile file('../keystore/samlator.jks')
            storePassword 'samlator'
            keyAlias 'samlator'
            keyPassword 'samlator'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.stable
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig false
        prefab false
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            excludes += ['META-INF/**']
        }
    }

    lint {
        abortOnError false
    }
}
