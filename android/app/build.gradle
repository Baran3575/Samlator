plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.samlator'
    compileSdk 35
    ndkVersion '27.0.12077973'

    defaultConfig {
        applicationId 'dev.samlator'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    sourceSets {
        main {
            // `scripts/build-apk.sh` drops the cargo-built cdylib here.
            jniLibs.srcDirs = ['src/main/jniLibs']
            assets.srcDirs = ['src/main/assets']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Sideloading needs a signature; the debug key is enough for that
            // and keeps the repository free of secrets.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig false
        prefab false
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            excludes += ['META-INF/**']
        }
    }

    lint {
        abortOnError false
    }
}
